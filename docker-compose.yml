# Local full stack: docker compose up --build  -> API on :8000 (Postgres), run the frontend with npm run dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nigraan
      POSTGRES_PASSWORD: nigraan
      POSTGRES_DB: nigraan
    ports: ["5432:5432"]
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://nigraan:nigraan@db:5432/nigraan
      JWT_SECRET: local-dev-secret
      DEMO_MODE: "true"
      ALLOWED_ORIGIN: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports: ["8000:8000"]
    depends_on: [db]
